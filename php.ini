; TinyTales BabyBook - Portable Local Development php.ini
; Clean configuration with zero external DLL dependencies (No MongoDB required)

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 256M
date.timezone = UTC

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
